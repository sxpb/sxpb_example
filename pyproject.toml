[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "sxpb_example"
version = "0.0.0"
authors = [
]
dependencies = [
]
requires-python = ">=3.9"

[dependency-groups]
dev = [
    "pytest",
    "sxpb @ git+https://github.com/sxproto/sxpb-py.git",
]

[tool.pytest.ini_options]
addopts = "-v"
pythonpath = ["test"]
testpaths = ["test"]

[tool.pdm.scripts]
test = "pytest"
